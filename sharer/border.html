<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Screenie — Active</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        /* Red border rendered via box-shadow so it never shifts layout */
        box-shadow: inset 0 0 0 6px #ef4444;
        pointer-events: none;
      }

      #panel {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(13, 17, 23, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px 14px;
        min-width: 220px;
        pointer-events: auto;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      #panel-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        flex-shrink: 0;
        box-shadow: 0 0 6px #ef4444;
      }

      #ip-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: #e6edf3;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #disconnect-btn {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 10px;
        min-height: 26px;
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.35);
        border-radius: 6px;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease;
        flex-shrink: 0;
      }

      #disconnect-btn:hover {
        background: rgba(239, 68, 68, 0.28);
        border-color: rgba(239, 68, 68, 0.6);
      }

      #disconnect-btn:active {
        background: rgba(239, 68, 68, 0.4);
      }

      #disconnect-btn:focus-visible {
        outline: 2px solid rgba(239, 68, 68, 0.5);
        outline-offset: 2px;
      }

      #pause-pill {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: rgba(210, 153, 34, 0.15);
        border: 1px solid rgba(210, 153, 34, 0.4);
        border-radius: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        color: #d29922;
        pointer-events: none;
      }

      #pause-pill.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="panel-row">
        <div id="dot" aria-hidden="true"></div>
        <span id="ip-label">Verbunden</span>
        <button id="disconnect-btn" type="button">Trennen</button>
      </div>
      <div id="pause-pill" role="status" aria-live="polite">
        <span aria-hidden="true">&#9646;&#9646;</span>
        Steuerung pausiert
      </div>
    </div>

    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { listen } from "@tauri-apps/api/event";

      const ipLabel = document.getElementById("ip-label");
      const pausePill = document.getElementById("pause-pill");

      listen("border-info", (e) => {
        const { ipPrefix } = e.payload;
        if (ipPrefix) {
          ipLabel.textContent = `Verbunden mit ${ipPrefix}`;
        }
      });

      listen("input-paused-changed", (e) => {
        if (e.payload.paused) {
          pausePill.classList.add("visible");
        } else {
          pausePill.classList.remove("visible");
        }
      });

      document.getElementById("disconnect-btn").addEventListener("click", () => {
        invoke("disconnect_streaming").catch((err) => {
          console.error("disconnect_streaming failed:", err);
        });
      });
    </script>
  </body>
</html>
