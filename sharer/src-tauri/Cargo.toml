[package]
name = "auffi-sharer"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }
cc = "=1.2.25"

[dependencies]
tauri = { version = "=2.11.1", features = [] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "=0.29.0", features = ["native-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
url = "=2.5.8"
futures-util = "=0.3.32"
webrtc = "=0.17.1"
enigo = "=0.6.1"
log = "=0.4.27"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-dialog = "=2.7.1"
dirs = "=6.0.0"
bytes = "=1.11.1"
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "=1.23.1", features = ["v4"] }
tauri-plugin-store = "=2.4.3"
tauri-plugin-shell = "=2.3.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", features = ["randr", "render", "shm", "image"] }
ashpd = { version = "=0.10.2", default-features = false, features = ["tokio"] }
# Direct PipeWire bindings — used by the legacy SHM-only portal backend that
# stalls on KDE Plasma 6's DMA-BUF-only output. Kept around as reference.
pipewire = "=0.9.2"
# GStreamer-based Wayland capture: `pipewiresrc` element handles the DMA-BUF
# / SHM / VideoModifier negotiation that pipewire-rs's raw SPA pods don't
# expose ergonomically.
gstreamer = "=0.24.0"
gstreamer-app = "=0.24.0"
gstreamer-video = "=0.24.0"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = "=0.9.4"

[target.'cfg(windows)'.build-dependencies]
vcpkg = "=0.2.15"

[dev-dependencies]
tempfile = "=3.27.0"
uuid = { version = "=1.23.1", features = ["v4"] }
tauri-plugin-store = "=2.4.3"
tauri-plugin-shell = "=2.3.5"
