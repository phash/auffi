[package]
name = "auffi-sharer"
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Auffi — sicheres Open-Source Bildschirm-Sharing mit Fernsteuerung"
repository = "https://github.com/phash/auffi"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
cc = "=1.4.4"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
# The `rustls-tls-native-roots` feature is kept for the Connector type and the
# rustls-native-certs dependency, but we do NOT use its default connector: it
# trusts the OS store alone, which on Windows is populated lazily and left the
# sharer unable to connect on machines whose store had not cached ISRG Root X2.
# See src/tls_roots.rs — the anchors are merged with the bundled set instead.
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
rustls-native-certs = "=0.8.4"
webpki-roots = "=1.0.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
futures-util = "=0.3.34"
# Held on the 0.17 line: 0.20 is the sans-io full rewrite (no 0.18/0.19
# exist) that rearchitects the load-bearing connectivity settings from
# docs/footguns.md — scheduled as its own migration project once 0.21
# stabilizes.
webrtc = "=0.17.2"
enigo = "=0.6.1"
log = "=0.4.34"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
dirs = "=6.0.0"
bytes = "=1.12.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
# rustls 0.23+ refuses to auto-pick a CryptoProvider when both 'ring'
# (via webrtc-rs) and 'aws-lc-rs' (via rustls-platform-verifier) are in
# the graph. We install ring explicitly at process startup in lib.rs.
# The version is pinned to the same release the rest of the graph
# resolves to (see Cargo.lock).
rustls = { version = "=0.23.43", default-features = false, features = ["ring"] }
uuid = { version = "=1.26.0", features = ["v4"] }
tauri-plugin-store = "=2.4.4"
tauri-plugin-shell = "=2.3.5"
# Open the diagnostic log file in the OS default handler (diagnostics). The
# blessed replacement for the now-deprecated `tauri_plugin_shell::Shell::open`.
tauri-plugin-opener = "=2.5.4"
# UPnP IGD client for discovering the home router's external IP without
# round-tripping our STUN server. See `nat_traversal.rs` and issue #89.
# The `aio_tokio` feature drives the SSDP/SOAP traffic on our existing
# tokio runtime instead of spawning a blocking thread.
igd-next = { version = "=0.17.1", default-features = false, features = ["aio_tokio"] }
# argon2id for the local device password (unattended mode). Params must
# stay aligned with backend/src/auth/argon.ts: m=64 MiB, t=3, p=1.
argon2 = "=0.6.0"
# OS-native credential store for the unattended device token: Secret
# Service on Linux, Keychain on macOS, Credential Manager on Windows.
# `linux-native-sync-persistent` keeps the call surface synchronous so
# the keyring access doesn't drag tokio into account.rs.
# Held at 3.x: keyring 4 removes all four feature names below and swaps
# the Linux store to zbus-secret-service — whether already-stored
# unattended device tokens survive the store change is unverified, and
# migrating blind could break every existing pairing on update.
keyring = { version = "=3.6.3", default-features = false, features = [
    "linux-native-sync-persistent",
    "apple-native",
    "windows-native",
    "crypto-rust",
] }
# Cross-platform autostart registration (.desktop on Linux,
# LaunchAgent on macOS, Run reg key on Windows). Defaults to off; the
# unattended-mode UI flips it via the `enable_autostart` /
# `disable_autostart` Tauri commands.
tauri-plugin-autostart = "=2.5.1"
# Direct dep for the unattended heartbeat's backoff jitter. Already in
# the transitive graph (via reqwest/rustls); pinning it here is
# documentation of the fact that heartbeat.rs reaches for it.
getrandom = "=0.4.3"
# PNG decode for the tray icon (#26). The source icons under
# `icons/` are 16-bit-per-channel RGBA; tray-icon expects 8-bit RGBA
# so we decode the embedded 32x32.png at startup. Already a
# transitive dep via Tauri's image handling; pinning makes the
# direct usage explicit.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.14.0", features = ["randr", "render", "shm", "image"] }
# Held at 0.10: ashpd 0.13 splits every portal into its own feature and
# moves the screencast API to options-structs — needs a gst_portal.rs
# port that can only be compile-verified in a Linux build session.
ashpd = { version = "=0.10.2", default-features = false, features = ["tokio"] }
# GStreamer-based Wayland capture: `pipewiresrc` element handles the DMA-BUF
# / SHM / VideoModifier negotiation that pipewire-rs's raw SPA pods don't
# expose ergonomically.
# Held at 0.24: the 0.25 lockstep bump can't be compile-verified on this
# Windows host — do it in a Linux build session together with ashpd.
gstreamer = "=0.24.0"
gstreamer-app = "=0.24.0"
gstreamer-video = "=0.24.0"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "=0.9.8", features = ["wgc"] }
# COM apartment init for the WGC capture thread (fixes E_NOINTERFACE from
# video_recorder) + GDI BitBlt for the RDP/GPU-less fallback capture path.
windows = { version = "=0.62.2", features = [
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the diagnostic log open on the world-writable Unix temp dir.
libc = "=0.2.189"

[target.'cfg(windows)'.build-dependencies]
vcpkg = "=0.2.15"

[dev-dependencies]
tempfile = "=3.27.0"
uuid = { version = "=1.26.0", features = ["v4"] }
tauri-plugin-store = "=2.4.4"
tauri-plugin-shell = "=2.3.5"
# In-process HTTP server for testing reqwest-based clients without
# spinning up the real backend. Used by account.rs tests for the
# pair/unpair flow against the mock /api/devices/redeem.
mockito = "=1.7.2"
