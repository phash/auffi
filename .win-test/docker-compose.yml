# Windows-Installer-Test für den Auffi-Sharer via QEMU-in-Docker (dockur/windows).
# Vorbild: t2controller/.win-test. Bootet Windows 11, führt nach der OOBE
# automatisch oem/install.bat als Administrator aus: installiert die MSI still,
# startet Auffi.exe, prüft Prozess + Debug-Log. Ergebnis (RESULT=PASS/FAIL) ->
# share/install-result.txt.
#
#   Normalfall: .win-test/run.sh vX.Y.Z  (lädt + prüft die Assets, startet/rebootet
#   die VM, wartet auf share/install-result.txt). Mitschauen: http://127.0.0.1:8007
#   (noVNC). oem/install.bat läuft nur beim allerersten Boot und richtet einen
#   Logon-Task ein, der oem/smoke.bat (über die Freigabe, immer aktuell) bei jedem
#   Boot ausführt — die VM-Disk deshalb NICHT mit `down -v` verwerfen, ein warmer
#   Neustart testet ein neues Release in wenigen Minuten statt in einer Stunde.
#
# WICHTIG: explizites `name:` — sonst teilt sich dieses Dir (.win-test) den
# Default-Compose-Projektnamen mit t2controller/.win-test und `up` entfernt
# dessen t2cw-windows als vermeintlichen Orphan.
name: auffi-wintest
services:
  windows:
    # Pinned by digest — a mutable :latest tag is non-reproducible and a
    # supply-chain risk (the image runs privileged: /dev/kvm + NET_ADMIN).
    image: ghcr.io/dockur/windows@sha256:20b398ab935465f97ec8ab06489f7a85a5ad58e74e036ce66cc3c9172e7dbea8
    container_name: auffi-win-test
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "4"
      DISK_SIZE: "48G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      # Bind noVNC to loopback only — the web viewer has no auth, so it must
      # not be reachable from the network. (8007 host → 8006 guest; meidet t2cw:8006)
      - "127.0.0.1:8007:8006"
    volumes:
      - auffi-win-data:/storage
      - ./oem:/oem
      - ./share:/data
      # Zweitens in die Freigabe gemountet: so ist \\host.lan\Data\oem\smoke.bat
      # bei jedem Boot die aktuelle Fassung, ohne Windows neu zu installieren.
      - ./oem:/data/oem:ro
    stop_grace_period: 2m
    restart: "no"

volumes:
  auffi-win-data:
