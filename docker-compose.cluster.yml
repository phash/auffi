# Cluster-mode overlay — apply alongside docker-compose.prod.yml when this
# deployment shares a host with a multi-tenant Caddy reverse proxy that
# already terminates TLS for screenie.mr-development.de.
#
# Effect vs. standalone docker-compose.prod.yml:
#   * Drops our own caddy service (the cluster proxy owns 80/443).
#   * Attaches the backend container to the external `caddy-proxy` network
#     so the cluster proxy can resolve `screenie-backend:8080`.
#   * coturn stays unchanged — it owns its own TURN ports (3478/5349) and
#     does not collide with HTTP/HTTPS.
#
# Cluster prerequisites (one-time, outside this compose):
#   1. An external Docker network exists, default named `caddy-proxy`.
#   2. The cluster Caddyfile has a site block for screenie.mr-development.de
#      reverse-proxying /signal, /turn-credentials, /healthz, /readyz to
#      screenie-backend:8080, and serving the viewer SPA from the mounted
#      /opt/screenie/viewer-dist directory.
#
# Activate via deploy script: set CLUSTER_PROXY=caddy-proxy in ops/.env.deploy.

services:
  caddy:
    profiles: ["__disabled"]

  backend:
    networks:
      - internal
      - cluster-proxy

  viewer:
    image: nginx:1.29-alpine
    container_name: screenie-viewer
    restart: unless-stopped
    volumes:
      - ./viewer-dist:/usr/share/nginx/html:ro
      - ./nginx/screenie-viewer.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cluster-proxy

networks:
  cluster-proxy:
    external: true
    name: ${CLUSTER_PROXY:-caddy-proxy}
