# Cluster-mode overlay — apply alongside docker-compose.prod.yml when this
# deployment shares a host with a multi-tenant Caddy reverse proxy that
# already terminates TLS for auffi.app.
#
# Effect vs. standalone docker-compose.prod.yml:
#   * Drops our own caddy service (the cluster proxy owns 80/443).
#   * Attaches the backend container to the external `caddy-proxy` network
#     so the cluster proxy can resolve `auffi-backend:8080`.
#   * coturn stays unchanged — it owns its own TURN ports (3478/5349) and
#     does not collide with HTTP/HTTPS.
#
# Cluster prerequisites (one-time, outside this compose):
#   1. An external Docker network exists, default named `caddy-proxy`.
#   2. The cluster Caddyfile has a site block for auffi.app
#      reverse-proxying /signal, /turn-credentials, /healthz, /readyz to
#      auffi-backend:8080, and serving the viewer SPA from the mounted
#      /opt/screenie/viewer-dist directory (path retained for volume continuity).
#
# Activate via deploy script: set CLUSTER_PROXY=caddy-proxy in ops/.env.deploy.

services:
  caddy:
    profiles: ["__disabled"]

  backend:
    networks:
      - internal
      - cluster-proxy

  viewer:
    image: nginx:1.29-alpine
    container_name: auffi-viewer
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:mode=1777,size=1m
      - /var/cache/nginx:mode=1777,size=16m
      - /tmp:mode=1777,size=4m
    volumes:
      - ./viewer-dist:/usr/share/nginx/html:ro
      - ./nginx/auffi-viewer.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cluster-proxy

  # gh #38: dashboard SPA sidecar. The cluster Caddy proxies
  # /dashboard/* to this container (path stripped before forward),
  # exactly mirroring the viewer's setup at the root path.
  # IMPORTANT: this is the cluster-mode override. The standalone
  # docker-compose.prod.yml has the matching `dashboard:` block
  # with `networks: [internal]` — this overrides it so the cluster
  # Caddy can resolve `auffi-dashboard:80`.
  dashboard:
    networks:
      - cluster-proxy

  # One-shot sidecar: copies the Caddy-issued TLS cert + key for the TURN
  # subdomain from the cluster Caddy's data volume into a small shared
  # volume that coturn can read as its unprivileged user. Re-runs on every
  # `docker compose up` so cert renewals propagate after a redeploy or a
  # `maintenance.sh restart coturn`. Exits 0 cleanly even if the cert is
  # missing — coturn's entrypoint then disables TURNS but keeps UDP/TCP
  # TURN on 3478.
  turn-cert-stage:
    image: alpine:3.20
    container_name: auffi-turn-cert-stage
    restart: "no"
    # Caddy writes certificates as root:root mode 0600 inside its own data
    # volume. A non-root sidecar can only read them with CAP_DAC_READ_SEARCH
    # (a small but real capability grant) AND only if the staged-volume
    # ownership is pre-fixed. The cluster Caddy is shared — we don't control
    # its file ownership policy. So the sidecar still runs as UID 0, but is
    # neutered with all caps dropped, a read-only root filesystem, and
    # no-new-privileges. Effective attack surface for this 6-line cp script
    # is minimal. (gh #66)
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1m
    volumes:
      - caddy-data:/caddy-data:ro
      - turn-certs-staged:/staged
    environment:
      TURN_REALM: ${TURN_REALM:-turn.auffi.app}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        SRC_DIR=$$(find /caddy-data/caddy/certificates -type d -name "$${TURN_REALM}" 2>/dev/null | head -n1)
        if [ -n "$${SRC_DIR}" ] && [ -s "$${SRC_DIR}/$${TURN_REALM}.crt" ] && [ -s "$${SRC_DIR}/$${TURN_REALM}.key" ]; then
          cp "$${SRC_DIR}/$${TURN_REALM}.crt" /staged/cert.pem
          cp "$${SRC_DIR}/$${TURN_REALM}.key" /staged/key.pem
          chmod 644 /staged/cert.pem /staged/key.pem
          echo "[turn-cert-stage] staged cert and key from $${SRC_DIR}"
        else
          echo "[turn-cert-stage] no cert found for $${TURN_REALM}; TURNS will be disabled until Caddy issues one" >&2
          # Truncate any stale staged files so coturn's entrypoint disables TLS cleanly.
          : > /staged/cert.pem
          : > /staged/key.pem
        fi

  coturn:
    volumes:
      - ./coturn/turnserver.conf.tmpl:/etc/coturn/turnserver.conf.tmpl:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
      - turn-certs-staged:/var/lib/turn:ro
    depends_on:
      turn-cert-stage:
        condition: service_completed_successfully

volumes:
  turn-certs-staged:
  caddy-data:
    external: true
    name: caddyserver_caddy_data

networks:
  cluster-proxy:
    external: true
    name: ${CLUSTER_PROXY:-caddy-proxy}
