version: 2

# Weekly, one grouped PR for minor+patch per ecosystem/directory; majors come
# as individual PRs so their breaking notes get read. Every version stays an
# exact pin (CLAUDE.md § Library Versions) — Dependabot keeps the pin style.
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /viewer
      - /dashboard
      - /sharer
      - /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node runtime major (22 in backend/Dockerfile
      # and every CI job), not the newest Node release. Move it in the same
      # commit as the Dockerfile and the CI node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /sharer/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors held in sharer/src-tauri/Cargo.toml (the comment there says
      # why): none compiles as a drop-in. Their open major PRs filled all
      # five slots and stalled the minor/patch group from 2026-10-23 on.
      # Remove an entry when that migration lands.
      - dependency-name: webrtc
        update-types: ["version-update:semver-major"]
      - dependency-name: ashpd
        update-types: ["version-update:semver-major"]
      - dependency-name: "gstreamer*"
        update-types: ["version-update:semver-major"]
      - dependency-name: dirs
        update-types: ["version-update:semver-major"]
      - dependency-name: keyring
        update-types: ["version-update:semver-major"]

  # Dockerfiles: backend (node + alpine geoip stage) and the standalone Caddy.
  - package-ecosystem: docker
    directories:
      - /backend
      - /caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Backend stays on Node 22 until the planned move to 24
      # (docs/ops-runbook.md § Docker Conventions).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # docker-compose.{prod,cluster,smoke}.yml: coturn, nginx, alpine, busybox.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Odd nginx minors are the mainline branch; prod stays on stable. A
      # new stable minor (1.32) is bumped by hand, patches come through.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Locally built images (auffi-caddy, auffi-backend) are not on any
      # registry; looking them up failed every weekly compose run. So the
      # /caddy docker PR bumps only the FROM lines: edit the auffi-caddy tag
      # in docker-compose.prod.yml and the ops/lib.sh fallback in that PR
      # (ops/tests/caddy-version-lockstep.test.sh keeps it red until then).
      - dependency-name: "auffi-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
