name: Release

on:
  push:
    tags:
      - "v*"

# Write scopes live on the two jobs that publish, not on the workflow: the
# sharer build (which holds the Tauri signing key) runs read-only.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build Sharer Binaries
    uses: ./.github/workflows/build-sharer.yml
    secrets: inherit
    permissions:
      contents: read

  docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/phash/auffi-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/phash/auffi-backend:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sharer-linux
          path: release-artifacts/linux/

      - name: Download Windows binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sharer-windows
          path: release-artifacts/windows/

      # Basenames only: gh-release uploads assets flat, so lines like
      # `release-artifacts/linux/deb/…` would make the release body's
      # documented `sha256sum --check SHA256SUMS` fail for every asset.
      - name: Generate SHA256SUMS
        run: |
          find release-artifacts/ -type f -print0 | sort -z | \
            while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done > SHA256SUMS
          cat SHA256SUMS

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/linux/**
            release-artifacts/windows/**
            SHA256SUMS
          body: |
            ## Docker Image

            ```
            docker pull ghcr.io/phash/auffi-backend:${{ steps.tag.outputs.tag }}
            ```

            ## Sharer Installers

            | Platform | Format | Notes |
            |----------|--------|-------|
            | Linux    | .deb   | Debian / Ubuntu |
            | Linux    | .rpm   | Fedora / CentOS |
            | Linux    | .AppImage | Universal |
            | Windows  | .msi   | Windows Installer |
            | Windows  | .exe   | NSIS Setup |

            ## Verify Downloads

            ```
            sha256sum --check SHA256SUMS
            ```
