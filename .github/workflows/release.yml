name: Release

on:
  push:
    tags:
      - "v*"

# Write scopes live on the two jobs that publish, not on the workflow: the
# sharer build (which holds the Tauri signing key) runs read-only.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build Sharer Binaries
    uses: ./.github/workflows/build-sharer.yml
    secrets: inherit
    permissions:
      contents: read

  docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/phash/auffi-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/phash/auffi-backend:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sharer-linux
          path: release-artifacts/linux/

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sharer-windows
          path: release-artifacts/windows/

      # Basenames only: gh-release uploads assets flat, so lines like
      # `release-artifacts/linux/deb/…` would make the release body's
      # documented `sha256sum --check SHA256SUMS` fail for every asset.
      - name: Generate SHA256SUMS
        run: |
          find release-artifacts/ -type f -print0 | sort -z | \
            while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done > SHA256SUMS
          cat SHA256SUMS

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/linux/**
            release-artifacts/windows/**
            SHA256SUMS
          body: |
            ## Docker Image

            ```
            docker pull ghcr.io/phash/auffi-backend:${{ steps.tag.outputs.tag }}
            ```

            ## Sharer Installers

            | Platform | Format | Notes |
            |----------|--------|-------|
            | Linux    | .deb   | Debian / Ubuntu |
            | Linux    | .rpm   | Fedora / CentOS |
            | Linux    | .AppImage | Universal |
            | Windows  | .msi   | Windows Installer |
            | Windows  | .exe   | NSIS Setup |

            ## Verify Downloads

            ```
            sha256sum --check SHA256SUMS
            ```
