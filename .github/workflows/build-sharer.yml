name: Build Sharer Binaries

# Kein eigener push:tags-Trigger — release.yml (v*-Tags) ruft dieses
# Workflow via workflow_call auf; ein zusätzlicher Tag-Trigger hier würde
# jeden Release-Build doppelt laufen lassen (die Artifacts des Standalone-
# Runs würden nie verwendet).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-linux:
        description: "Linux artifact name"
        value: ${{ jobs.build-linux.outputs.artifact-name }}
      artifact-windows:
        description: "Windows artifact name"
        value: ${{ jobs.build-windows.outputs.artifact-name }}

# Read-only token. The build steps see TAURI_SIGNING_PRIVATE_KEY, so this is
# the workflow where a compromised action would hurt most — it must not also
# hold a token that can push to the repo or the registry.
permissions:
  contents: read

jobs:
  build-linux:
    name: Build Sharer (Linux)
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: sharer-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libvpx-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxtst-dev \
            libx11-dev \
            libxrandr-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.1"
          cache-workspaces: sharer/src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sharer/package-lock.json

      - name: Install sharer Node dependencies
        working-directory: sharer
        run: npm ci

      - name: Build Tauri app (Linux)
        working-directory: sharer
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sharer-linux
          path: |
            sharer/src-tauri/target/release/bundle/deb/*.deb
            sharer/src-tauri/target/release/bundle/rpm/*.rpm
            sharer/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

  build-windows:
    name: Build Sharer (Windows)
    runs-on: windows-2025
    outputs:
      artifact-name: sharer-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.1"
          cache-workspaces: sharer/src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sharer/package-lock.json

      - name: Install sharer Node dependencies
        working-directory: sharer
        run: npm ci

      - name: Install libvpx (vcpkg)
        # VCPKG_INSTALLATION_ROOT is a runner-preset env var — it is NOT in the
        # ${{ env }} expression context, so export it to GITHUB_ENV from the
        # shell instead (the build.rs vcpkg crate looks up VCPKG_ROOT).
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install libvpx:x64-windows-static-md

      - name: Build Tauri app (Windows)
        working-directory: sharer
        run: npm run tauri:build
        env:
          # static-md triplet matches Rust's default dynamic-CRT MSVC linkage.
          VCPKGRS_TRIPLET: x64-windows-static-md
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage portable exe
        # tauri:build also emits the unbundled, self-contained binary under
        # target/release/. It is named after the Cargo package (auffi-sharer.exe),
        # NOT the productName. Rename it to the versioned portable name so it is a
        # first-class release asset (previously it had to be hand-built on a
        # Windows box each release — see docs/ops-runbook.md § Portable-Gotcha).
        shell: pwsh
        run: |
          $ver = (Get-Content sharer/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item sharer/src-tauri/target/release/auffi-sharer.exe `
            "sharer/src-tauri/target/release/Auffi_${ver}_x64_portable.exe"

      - name: Upload Windows bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sharer-windows
          path: |
            sharer/src-tauri/target/release/bundle/msi/*.msi
            sharer/src-tauri/target/release/bundle/nsis/*.exe
            sharer/src-tauri/target/release/Auffi_*_x64_portable.exe
          retention-days: 30
