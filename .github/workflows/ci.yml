name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  viewer:
    name: Viewer (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vite build uses esbuild and does NOT type-check — run tsc explicitly.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  sharer-webview:
    name: Sharer webview (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sharer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sharer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build webview bundle
        run: npm run build

  sharer:
    name: Sharer (Rust + Tauri, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libvpx-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxtst-dev \
            libx11-dev \
            libxrandr-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: sharer/src-tauri

      - name: Check formatting
        working-directory: sharer/src-tauri
        run: cargo fmt --check

      # --lib --tests matches the Definition-of-Done gate in CLAUDE.md —
      # without --tests, warnings in #[cfg(test)] code pass CI but fail
      # the documented local command.
      - name: Clippy (deny warnings)
        working-directory: sharer/src-tauri
        run: cargo clippy --lib --tests --no-deps -- -D warnings

      - name: Run unit tests
        working-directory: sharer/src-tauri
        run: cargo test --lib

      - name: Compile check (release profile)
        working-directory: sharer/src-tauri
        run: cargo check --release

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, viewer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci

      - name: Install Playwright browsers
        working-directory: viewer
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        # Log to a file so the wait step below can dump it when the
        # backend never comes up (the backgrounded process's output is
        # otherwise lost once this step ends).
        run: npm run dev > /tmp/backend-dev.log 2>&1 &
        env:
          PORT: 8080
          HOST: 127.0.0.1
          SESSION_TTL_MS: "600000"
          RATE_LIMIT_WINDOW_MS: "60000"
          RATE_LIMIT_MAX: "5"
          # 5173 = viewer (headless Chrome), 5174 = mock-sharer.mjs Origin.
          # Both must be allowed or the sharer's WS upgrade gets 403 and the
          # connect/input specs time out waiting for AUFFI_CODE.
          ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
          NODE_ENV: test
          # Don't try to mkdir the prod DB path (/var/lib/auffi) — not
          # writable on the runner; the backend would crash and :8080 never
          # come up (the old ECONNREFUSED). In-memory DB is fine for E2E.
          AUFFI_DB_PATH: ":memory:"

      # Fail the job HERE when the server never comes up — without the
      # final probe + exit 1 the step passes and the failure surfaces
      # later as opaque Playwright timeouts.
      - name: Wait for backend to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become ready within 30s"
          cat /tmp/backend-dev.log || true
          exit 1

      - name: Start viewer dev server
        working-directory: viewer
        run: npm run dev > /tmp/viewer-dev.log 2>&1 &
        env:
          # The viewer reads VITE_BACKEND_WS (viewer/src/env.d.ts) —
          # VITE_WS_URL was a dead variable and the E2E run silently
          # rode the built-in localhost fallback.
          VITE_BACKEND_WS: ws://127.0.0.1:8080/signal

      - name: Wait for viewer dev server to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null 2>&1; then
              echo "Viewer ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Viewer dev server did not become ready within 30s"
          cat /tmp/viewer-dev.log || true
          exit 1

      - name: Run Playwright E2E tests
        working-directory: viewer
        # CI runs the specs that are reliable headless: signaling/UI flows.
        # Excluded from the PR gate (run manually / locally):
        #  - connect.spec.ts + input.spec.ts drive a live WebRTC media+
        #    datachannel handshake (headless Chrome ↔ node-webrtc mock sharer)
        #    that does not complete reliably in headless CI even with mDNS
        #    disabled, fake media and retries — #remote-video never paints.
        #  - production.spec.ts + visual-audit.spec.ts hit live auffi.app
        #    (bot-blocked on a headless UA) — they are diagnostic tools.
        run: npx playwright test unattended.spec.ts review-fixes.spec.ts
        env:
          VIEWER_URL: http://localhost:5173

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: viewer/test-results/
          retention-days: 7
