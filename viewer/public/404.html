<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seite nicht gefunden — Auffi</title>
    <meta name="description" content="Die angeforderte Seite existiert nicht. Zur Startseite von Auffi." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://auffi.app/404.html" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="stylesheet" href="/topbar-footer.css" />
    <style>
      body {
        font-family: var(--font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
        background: var(--bg, #f0f2f5);
        color: var(--text, #1a1d23);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        max-width: 560px;
        margin: 0 auto;
        padding: 4rem 1.5rem 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 0.5rem;
        line-height: 1.1;
      }
      .code {
        color: var(--text-secondary, #5a6070);
        font-size: 1rem;
        margin: 0 0 1.5rem;
      }
      p {
        font-size: 1.0625rem;
        line-height: 1.55;
        margin: 0 0 2rem;
      }
      .cta {
        display: inline-block;
        background: var(--accent, #1f6feb);
        color: white;
        text-decoration: none;
        padding: 0.65rem 1.4rem;
        border-radius: 6px;
        font-weight: 500;
      }
      .cta:hover {
        background: var(--accent-hover, #1a5ecb);
      }
    </style>
  </head>
  <body>
    <header id="top-bar" role="banner">
      <a href="/" class="topbar-wordmark" aria-label="Auffi — Zur Startseite">Auffi</a>
      <span class="topbar-tagline" aria-hidden="true">Bildschirm-Freigabe — Open Source</span>
    </header>

    <main>
      <p class="code">Fehler 404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>
        Vielleicht hat sich ein Tippfehler eingeschlichen, oder der Link
        ist veraltet. Zur Startseite kommst du über den Button.
      </p>
      <a href="/" class="cta">Zur Startseite</a>
    </main>

    <footer id="site-footer" role="contentinfo">
      <a href="/impressum/">Impressum</a>
      <span aria-hidden="true">·</span>
      <a href="/datenschutz/">Datenschutz</a>
    </footer>
  </body>
</html>
