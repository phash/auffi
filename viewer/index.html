<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenie — Viewer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --accent: #1f6feb;
        --accent-hover: #1a5ecb;
        --accent-active: #164faa;
        --bg: #f0f2f5;
        --card-bg: #ffffff;
        --text: #1a1d23;
        --text-secondary: #5a6070;
        --border: #e2e5ea;
        --shadow: 0 2px 8px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
        --radius: 12px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --topbar-height: 52px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --card-bg: #161b22;
          --text: #e6edf3;
          --text-secondary: #8b949e;
          --border: #30363d;
          --shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
        }
      }

      /* ============================================================
         Top Bar
         ============================================================ */
      #top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--topbar-height);
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        gap: 0.75rem;
      }

      @media (prefers-color-scheme: dark) {
        #top-bar {
          background: rgba(13,17,23,0.85);
        }
      }

      .topbar-wordmark {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent);
        white-space: nowrap;
        flex-shrink: 0;
        text-decoration: none;
      }

      .topbar-tagline {
        font-size: 0.8125rem;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
      }

      @media (max-width: 480px) {
        .topbar-tagline { display: none; }
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .topbar-btn {
        font-family: var(--font);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        min-height: 32px;
        border: 1.5px solid var(--border);
        border-radius: 100px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        text-decoration: none;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
        background: var(--card-bg);
        color: var(--text);
        -webkit-appearance: none;
        outline: none;
      }

      .topbar-btn:focus-visible {
        outline: 3px solid rgba(31,111,235,0.4);
        outline-offset: 2px;
      }

      .topbar-btn:hover {
        background: var(--bg);
        border-color: var(--text-secondary);
      }

      .topbar-btn-coffee {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .topbar-btn-coffee:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
        color: #fff;
      }

      .topbar-btn-label {
        display: inline;
      }

      @media (max-width: 380px) {
        .topbar-btn-label { display: none; }
        .topbar-btn { padding: 0.375rem 0.5rem; }
      }

      /* ============================================================ */

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--topbar-height) + 1rem) 1rem 1rem;
        transition: background 200ms ease;
      }

      #app {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 2rem;
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .brand-icon svg {
        width: 16px;
        height: 16px;
        fill: #fff;
      }

      .brand-name {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .instruction {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--text-secondary);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #code {
        font-family: "SF Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-align: center;
        padding: 0.75rem 1rem;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text);
        width: 100%;
        min-height: 56px;
        transition: border-color 200ms ease, box-shadow 200ms ease;
        outline: none;
        -webkit-appearance: none;
      }

      #code:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
      }

      #code::placeholder {
        color: var(--border);
        letter-spacing: 0.08em;
      }

      #connect {
        font-family: var(--font);
        font-size: 1rem;
        font-weight: 500;
        padding: 0.75rem 1rem;
        min-height: 48px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 150ms ease, opacity 150ms ease, transform 100ms ease;
        -webkit-appearance: none;
      }

      #connect:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      #connect:active:not(:disabled) {
        background: var(--accent-active);
        transform: translateY(1px);
      }

      #connect:focus-visible {
        outline: 3px solid rgba(31, 111, 235, 0.4);
        outline-offset: 2px;
      }

      #connect:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #status {
        font-size: 0.875rem;
        line-height: 1.5;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 1.5rem;
        color: var(--text-secondary);
        transition: color 200ms ease;
      }

      #status:empty { display: none; }

      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--text-secondary);
        transition: background 200ms ease;
      }

      #status.ok { color: var(--text); }
      #status.ok::before { background: #2da44e; }

      #status.err { color: #cf222e; }
      #status.err::before { background: #cf222e; }

      #status.info::before { background: var(--accent); }

      /* Video area */
      .video-wrapper {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
        display: none;
      }

      .video-wrapper.active {
        display: block;
      }

      #remote-video {
        display: block;
        width: 100%;
        max-width: 100%;
        border-radius: 8px;
        background: #000;
        opacity: 0;
        transition: opacity 400ms ease;
      }

      #remote-video.active {
        display: block;
        opacity: 1;
      }

      #disconnect {
        position: absolute;
        top: 0.625rem;
        right: 0.625rem;
        font-family: var(--font);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        min-height: 32px;
        background: rgba(0,0,0,0.55);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 150ms ease;
        display: none;
        -webkit-appearance: none;
      }

      #disconnect.active {
        display: inline-flex;
        align-items: center;
      }

      #disconnect:hover {
        background: rgba(0,0,0,0.75);
      }

      #disconnect:focus-visible {
        outline: 2px solid rgba(255,255,255,0.6);
        outline-offset: 2px;
      }

      /* Connection-type badge */
      #connection-type {
        position: absolute;
        top: 0.625rem;
        left: 0.625rem;
        font-family: var(--font);
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.25rem 0.5rem;
        background: rgba(0,0,0,0.55);
        color: rgba(255,255,255,0.85);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 5px;
        backdrop-filter: blur(4px);
        display: none;
        pointer-events: none;
        user-select: none;
      }

      #connection-type.active {
        display: inline-block;
      }

      #connection-type.relay {
        color: #f0a500;
        border-color: rgba(240,165,0,0.4);
      }

      /* Input control toolbar */
      #video-toolbar {
        position: absolute;
        top: 0.625rem;
        right: 6rem;
        display: none;
      }

      #video-toolbar.active {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      #input-toggle {
        font-family: var(--font);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.625rem;
        min-height: 32px;
        background: rgba(0,0,0,0.55);
        color: rgba(255,255,255,0.75);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        white-space: nowrap;
        -webkit-appearance: none;
      }

      #input-toggle:hover {
        background: rgba(0,0,0,0.72);
        color: #fff;
      }

      #input-toggle:focus-visible {
        outline: 2px solid rgba(255,255,255,0.6);
        outline-offset: 2px;
      }

      #input-toggle[aria-pressed="true"] {
        background: rgba(31,111,235,0.75);
        color: #fff;
        border-color: rgba(31,111,235,0.8);
      }

      #input-toggle[aria-pressed="true"]:hover {
        background: rgba(31,111,235,0.92);
      }

      .indicator-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255,255,255,0.45);
        flex-shrink: 0;
        transition: background 150ms ease;
      }

      #input-toggle[aria-pressed="true"] .indicator-dot {
        background: #7dd3fc;
      }

      #file-send-btn {
        font-family: var(--font);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.625rem;
        min-height: 32px;
        background: rgba(0,0,0,0.55);
        color: rgba(255,255,255,0.75);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 150ms ease, color 150ms ease;
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        white-space: nowrap;
        -webkit-appearance: none;
      }

      #file-send-btn:hover {
        background: rgba(0,0,0,0.72);
        color: #fff;
      }

      #file-send-btn:focus-visible {
        outline: 2px solid rgba(255,255,255,0.6);
        outline-offset: 2px;
      }

      /* File offer toast */
      #file-offer-toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 1rem 1.25rem;
        display: none;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 280px;
        max-width: 360px;
        z-index: 100;
      }

      #file-offer-toast.active {
        display: flex;
      }

      .toast-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text);
      }

      .toast-body {
        font-size: 0.8125rem;
        color: var(--text-secondary);
        word-break: break-all;
      }

      .toast-actions {
        display: flex;
        gap: 0.5rem;
      }

      .toast-btn {
        font-family: var(--font);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        min-height: 32px;
        border-radius: 6px;
        cursor: pointer;
        border: none;
        -webkit-appearance: none;
      }

      .toast-btn-accept {
        background: var(--accent);
        color: #fff;
      }

      .toast-btn-accept:hover {
        background: var(--accent-hover);
      }

      .toast-btn-reject {
        background: var(--border);
        color: var(--text);
      }

      .toast-btn-reject:hover {
        background: #d0d3d8;
      }

      /* Drop-over highlight */
      .video-wrapper.drop-over #remote-video {
        outline: 3px dashed rgba(31,111,235,0.7);
        outline-offset: -3px;
      }

      /* Free-tier warning toast */
      #free-tier-warning-toast {
        position: fixed;
        top: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(-120%);
        background: #7a4f00;
        color: #ffe5a0;
        border: 1px solid rgba(240,165,0,0.5);
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        padding: 0.75rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        z-index: 200;
        pointer-events: none;
        transition: transform 300ms ease;
        white-space: nowrap;
      }

      #free-tier-warning-toast.active {
        transform: translateX(-50%) translateY(0);
      }

      @media (prefers-color-scheme: dark) {
        #free-tier-warning-toast {
          background: #3b2700;
          color: #fbbf24;
          border-color: rgba(251,191,36,0.35);
        }
      }
    </style>
  </head>
  <body>
    <header id="top-bar" role="banner">
      <span class="topbar-wordmark" aria-label="Screenie">Screenie</span>
      <span class="topbar-tagline" aria-hidden="true">Screen-Sharing — Open Source</span>
      <nav class="topbar-actions" aria-label="Links">
        <a
          id="topbar-download"
          href="https://github.com/phash/screenie/releases/latest"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-btn"
          aria-label="Sharer herunterladen (öffnet GitHub in neuem Tab)"
        >
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/>
            <path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.97a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.779a.749.749 0 1 1 1.06-1.06l1.97 1.97Z"/>
          </svg>
          <span class="topbar-btn-label">Sharer herunterladen</span>
        </a>
        <a
          id="topbar-coffee"
          href="https://buymeacoffee.com/phash"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-btn topbar-btn-coffee"
          aria-label="Buy me a coffee (öffnet buymeacoffee.com in neuem Tab)"
        >
          ☕ <span class="topbar-btn-label">Buy me a coffee</span>
        </a>
      </nav>
    </header>

    <main id="app">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="2" width="14" height="9" rx="1.5"/>
            <rect x="5" y="12" width="6" height="1.5" rx="0.75"/>
            <rect x="4" y="13.5" width="8" height="1" rx="0.5"/>
          </svg>
        </div>
        <span class="brand-name">Screenie</span>
      </div>

      <p class="instruction">Du wurdest um Hilfe gebeten? Gib den Code ein, den dir die andere Person genannt hat.</p>

      <div class="input-group">
        <input
          id="code"
          maxlength="11"
          placeholder="000-000-000"
          autocomplete="off"
          inputmode="numeric"
          aria-label="Verbindungscode"
        />
        <div style="display: flex; gap: 0.5rem;">
          <button id="connect" style="flex:1;">Verbinden</button>
          <button id="refresh-btn" type="button" title="Zurücksetzen" aria-label="Code zurücksetzen" style="flex-shrink:0; padding: 0.75rem 0.875rem; min-height: 48px; background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 150ms ease, color 150ms ease; font-size: 1rem;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.325-3.566L14 3v4h-4l1.698-1.698A4 4 0 1 0 12 8h1.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div id="reconnect-wrap" style="display:none;">
        <button id="reconnect-btn" type="button" style="width:100%; padding:0.75rem 1rem; min-height:48px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-family:var(--font); font-size:1rem; font-weight:500; transition:background 150ms ease;">
          Erneut verbinden
        </button>
      </div>

      <div class="video-wrapper" id="video-wrapper">
        <video id="remote-video" autoplay playsinline muted></video>
        <div id="video-toolbar">
          <button id="input-toggle" aria-pressed="false">
            <span class="indicator-dot" aria-hidden="true"></span>
            <span id="input-toggle-label">Steuerung aktivieren</span>
          </button>
          <button id="file-send-btn" title="Datei senden">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
              <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
            </svg>
            Datei senden
          </button>
          <input type="file" id="file-input" hidden />
        </div>
        <button id="disconnect">Trennen</button>
        <div id="connection-type" role="status" aria-live="polite" aria-label="Verbindungstyp"></div>
      </div>
    </main>

    <div id="free-tier-warning-toast" role="alert" aria-live="assertive" aria-atomic="true">
      ⚠ Noch 2 Min Relay-Zeit übrig — Premium kommt bald
    </div>

    <div id="file-offer-toast" role="dialog" aria-modal="true" aria-label="Dateiübertragung">
      <div class="toast-title">Dateiübertragung</div>
      <div class="toast-body" id="file-offer-body"></div>
      <div class="toast-actions">
        <button class="toast-btn toast-btn-accept" id="file-offer-accept">Annehmen</button>
        <button class="toast-btn toast-btn-reject" id="file-offer-reject">Ablehnen</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
