<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Auffi Open-Graph Image (1200×630).

    Safe-Zone-Design: all critical content sits within the central ~560 px
    (x≈320..880) so Facebook Mobile's near-1:1 thumbnail crop (mittlere
    630 px) keeps logo, headline, bullets and URL fully visible. The wider
    1.91:1 frame (used on Desktop, LinkedIn, Twitter) gets a subtle glow
    extending into the side margins.

    Re-render with:
      rsvg-convert -w 1200 -h 630 ops/og-image.svg -o viewer/public/og-image.png
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.22" r="0.65">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Hero: Icon (100×100) + "Auffi" wordmark, horizontal block centered on x=600 -->
  <g transform="translate(395, 110)">
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#iconGrad)"/>
    <rect x="22" y="28" width="56" height="36" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="42" y="68" width="16" height="5" rx="1.5" ry="1.5" fill="#ffffff"/>
    <text x="128" y="86" font-family="Roboto, 'Open Sans', Arial, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-3">Auffi</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" font-family="Roboto, 'Open Sans', Arial, sans-serif" font-weight="500" font-size="26" fill="#94a3b8">Bildschirm-Sharing · Open Source · DSGVO-konform</text>

  <!-- 3 USP bullets, block left-aligned but block-centered on canvas (width ≈ 555 px) -->
  <g transform="translate(323, 330)" font-family="Roboto, 'Open Sans', Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff">

    <!-- 1: Lock -->
    <g transform="translate(0, 0)">
      <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="20" width="34" height="24" rx="3" ry="3"/>
        <path d="M11 20 V13 a10 10 0 0 1 20 0 V20"/>
      </g>
      <text x="58" y="44">Ende-zu-Ende verschlüsselt</text>
    </g>

    <!-- 2: German flag -->
    <g transform="translate(0, 72)">
      <g transform="translate(4, 17)">
        <rect x="0" y="0" width="38" height="10" fill="#000000"/>
        <rect x="0" y="10" width="38" height="10" fill="#dd0000"/>
        <rect x="0" y="20" width="38" height="10" fill="#ffce00"/>
        <rect x="0" y="0" width="38" height="30" fill="none" stroke="#1e293b" stroke-width="1"/>
      </g>
      <text x="58" y="44">Server in Deutschland</text>
    </g>

    <!-- 3: Code brackets -->
    <g transform="translate(0, 144)">
      <g stroke="#60a5fa" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="30 22 40 32 30 42"/>
        <polyline points="12 22 2 32 12 42"/>
        <line x1="25" y1="18" x2="17" y2="46"/>
      </g>
      <text x="58" y="44">AGPL Open Source · kein Konto</text>
    </g>

  </g>

  <!-- Footer URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Roboto, 'Open Sans', Arial, sans-serif" font-weight="700" font-size="30" fill="#3b82f6">auffi.app</text>
</svg>
