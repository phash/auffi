services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: auffi-backend:dev
    container_name: auffi-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      # In-Container-Port bleibt fix auf 8080 — Port-Mapping und Healthcheck
      # unten sind darauf gepinnt. BACKEND_PORT variiert nur die Host-Seite.
      - PORT=8080
      - HOST=${BACKEND_HOST:-0.0.0.0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
