# Replaces the stock `main` access log, which ends in $http_x_forwarded_for
# (Caddy sets it → full client IP) and logs $request verbatim: the mail links
# /verify|/reset|/verify-email-change/<token> are live account-takeover links
# (backend/src/server.ts TOKEN_IN_PATH redacts the same routes). The query
# string is dropped too. This file is mounted alone as conf.d/default.conf,
# so the map/log_format names cannot collide with auffi-viewer.conf.
map $request_uri $auffi_log_path {
    ~^/(?<auffi_token_route>verify|reset|verify-email-change)/  /$auffi_token_route/[redacted];
    ~^(?<auffi_path>[^?]*)                                       $auffi_path;
}
log_format auffi_redacted '[$time_local] "$request_method $auffi_log_path $server_protocol" '
                          '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout auffi_redacted;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is mounted under /dashboard/* by Caddy. Vite was
    # built with `base: "/dashboard/"` so the bundle references
    # /dashboard/assets/… — nginx serves the assets from
    # /usr/share/nginx/html which Caddy reaches via either the
    # /dashboard/* path-rewrite (cluster.yml proxy_pass) or by
    # mounting this container at the /dashboard root.

    # SPA fallback for client-side routing under /dashboard/*.
    # Caddy strips the /dashboard prefix BEFORE proxying, so we
    # match on the bare paths here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for content-hashed assets (Vite emits
    # /dashboard/assets/index-CCS2-K1k.js — Caddy strips /dashboard
    # so nginx sees /assets/...; the hash invalidates on every
    # rebuild).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell — the asset references inside it
    # change on every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health probe so the orchestrator can verify the dashboard
    # sidecar is alive before the cluster Caddy routes traffic.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
