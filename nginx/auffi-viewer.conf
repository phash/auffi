server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Eigene 404-Seite mit noindex und Link zur Hauptseite. Verhindert
    # die "Soft-404"-Falle (unbekannte Pfade liefern HTTP 200 mit der
    # Homepage — Google Search Console flagged das).
    error_page 404 /404.html;
    location = /404.html {
        # Internal-only damit ein direkter Aufruf von /404.html nicht
        # mit 200 served wird (was die noindex-Wirkung verwässern würde).
        internal;
    }

    # Marketing-Pages sind statisch (/, /impressum/, /datenschutz/,
    # /download/). Kein client-side Routing — der Viewer nutzt nur
    # ?code=… Query-Param. Unbekannte Pfade → echte 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-term caching for content-hashed assets (Vite emits files like
    # /assets/index-CCS2-K1k.js — the hash invalidates on every change)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Sharer binaries (.deb, .rpm, .AppImage, Windows installers) served
    # directly from /opt/screenie/viewer-dist/download/. Directory listing
    # enabled so users can pick the right installer; deploy.sh excludes
    # this path from the viewer-dist rsync so binaries survive redeploys.
    location /download/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "public, max-age=300";
        # Allow large file downloads
        client_max_body_size 0;
    }
}
