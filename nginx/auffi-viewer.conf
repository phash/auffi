server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Eigene 404-Seite mit noindex und Link zur Hauptseite. Verhindert
    # die "Soft-404"-Falle (unbekannte Pfade liefern HTTP 200 mit der
    # Homepage — Google Search Console flagged das).
    error_page 404 /404.html;
    location = /404.html {
        # Internal-only damit ein direkter Aufruf von /404.html nicht
        # mit 200 served wird (was die noindex-Wirkung verwässern würde).
        internal;
    }

    # Marketing-Pages sind statisch (/, /impressum/, /datenschutz/,
    # /download/). Kein client-side Routing — der Viewer nutzt nur
    # ?code=… Query-Param. Unbekannte Pfade → echte 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-term caching for content-hashed assets (Vite emits files like
    # /assets/index-CCS2-K1k.js — the hash invalidates on every change)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /download/ is a plain static marketing page (viewer/public/download/);
    # every installer is streamed through /api/downloads/file/:asset since
    # 2026-05-21 (docs/footguns.md § Download-Proxy Patterns). Legacy flat
    # files (install-linux.sh, latest.txt, pre-proxy installers) still sit
    # in viewer-dist/download/ on the host, are served by `location /`
    # above and are kept out of the rsync --delete by
    # VIEWER_DIST_RSYNC_EXCLUDES (ops/lib.sh). No autoindex: a listing
    # would expose the folder the moment index.html is renamed.
}
