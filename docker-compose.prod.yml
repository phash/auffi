# Production compose — backend + Caddy reverse-proxy + coturn TURN relay.
#
# TLS cert sharing: Caddy manages Let's Encrypt for auffi.app.
# coturn requires its own cert for turn.auffi.app — this must
# be provisioned separately (e.g. certbot on the host, writing into a named
# volume) and mounted at /etc/letsencrypt inside coturn. See ops/README.md for
# the one-time cert setup procedure.
#
# coturn runs with network_mode: host because TURN allocates dynamic UDP ports
# (49152-65535 by default) and Docker's UDP-port-range mapping is fragile at
# that scale. The trade-off: coturn ports are directly on the host network, not
# behind Docker's bridge, which is exactly what the TURN RFC requires.

volumes:
  caddy-data:
  caddy-config:
  viewer-static:
  turn-certs:
  # gh #38: SQLite store for accounts / devices / sessions / pairings
  # / connection_log / audit_log. Mounted into the backend at
  # /var/lib/auffi (the default DEFAULT_DB_PATH in src/db.ts). On a
  # fresh host the directory comes up empty; applyMigrations() on
  # the first boot creates every table. Volume name uses the same
  # `auffi-*` prefix the rest of this file uses — the docker-compose
  # project on prod is still `screenie` (see CLAUDE.md rebrand
  # notes) so the on-disk volume name will be `screenie_auffi-db`.
  auffi-db:

services:
  backend:
    image: auffi-backend:${APP_VERSION:-latest}
    container_name: auffi-backend
    restart: unless-stopped
    env_file: [.env.prod]
    expose:
      - "8080"
    volumes:
      # gh #38: persist accounts / devices / connection-log etc.
      # across container restarts.
      - auffi-db:/var/lib/auffi
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal

  # gh #38: dashboard sidecar — serves the Vite-built dist/ behind
  # the cluster Caddy at /dashboard/*. Caddy strips the prefix
  # before proxying, so nginx sees /, /assets/..., /login, etc.
  # See `nginx/auffi-dashboard.conf` for the SPA fallback config.
  dashboard:
    image: nginx:1.29-alpine
    container_name: auffi-dashboard
    restart: unless-stopped
    volumes:
      - ./dashboard-dist:/usr/share/nginx/html:ro
      - ./nginx/auffi-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal

  caddy:
    image: caddy:2.10.0-alpine
    container_name: auffi-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - viewer-static:/srv/viewer:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: auffi-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf.tmpl:/etc/coturn/turnserver.conf.tmpl:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
      - turn-certs:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_REALM: ${TURN_REALM:-turn.auffi.app}
      # Optional — pin coturn's bind interface and the public IP it
      # advertises in relay candidates. Both default to coturn's
      # interface auto-detection when unset. On the IONOS VPS the
      # public IPv4 is bound /32 to ens6 but coturn's auto-detect
      # skipped it; set both in .env.prod for that host.
      TURN_LISTENING_IP: ${TURN_LISTENING_IP:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}

networks:
  internal:
    driver: bridge
